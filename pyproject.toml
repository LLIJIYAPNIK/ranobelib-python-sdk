[project]
name = "ranobelib-python-sdk"
version = "0.1.0"
description = "Async Python SDK for ranobelib.me: title metadata, chapter/volume downloads, and export to epub/fb2/txt/pdf"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "LLIJIYAPNIK", email = "kas4wot@yandex.ru" }
]
keywords = ["ranobelib", "ranobe", "novel", "webnovel", "epub", "fb2", "sdk"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.urls]
Homepage = "https://github.com/LLIJIYAPNIK/ranobelib-python-sdk"
Repository = "https://github.com/LLIJIYAPNIK/ranobelib-python-sdk"
Issues = "https://github.com/LLIJIYAPNIK/ranobelib-python-sdk/issues"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ranobelib"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-recording>=0.13",
    "ruff>=0.6",
    "vcrpy>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]
extend-exclude = ["CLAUDE.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["ranobelib"]

[tool.coverage.report]
fail_under = 95
exclude_also = [
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]
